<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ramayana: Setu Runner | SkyRoket Productions</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#faf8f4; color:#2b2118;
    font-family: Georgia, 'Times New Roman', serif;
    display:flex; flex-direction:column; align-items:center;
    padding:0; margin:0; background:#1d1033; overflow:hidden; -webkit-user-select:none; user-select:none;
  }
  .masthead { text-align:center; margin-bottom:6px; }
  .brand { letter-spacing:4px; font-size:12px; color:#a8842c; text-transform:uppercase; }
  h1 { font-size:30px; font-weight:normal; margin:4px 0 2px; }
  h1 em { color:#a8842c; }
  .sub { font-style:italic; color:#6d5c43; font-size:14.5px; margin-bottom:12px; text-align:center; }
  #wrap { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#2a1450 0%,#7a2d5e 45%,#274b73 82%,#101f3c 100%); }
  canvas {
    width:min(100vw, 177.78vh); height:min(56.25vw, 100vh); display:block; border-radius:0;
    box-shadow:none;
    background:#1d1033; touch-action:none; cursor:pointer;
  }
  .bar { display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  button {
    font-family:inherit; font-size:15px; padding:10px 22px; border-radius:999px;
    border:1px solid #a8842c; background:#a8842c; color:#fff; cursor:pointer;
  }
  button.ghost { background:transparent; color:#a8842c; }
  button:active { transform:scale(.97); }
  .how { text-align:center; color:#6d5c43; font-size:13.5px; margin-top:12px; line-height:1.55; }
  .credit { text-align:center; color:#9a8a6d; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
  <h1>Ramayana: <em>Setu Runner</em></h1>
  </div>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    </div>

<script>
(function(){
  var cv = document.getElementById('game'), ctx = cv.getContext('2d');
  var W = 960, H = 540, GROUND = 448;

  // ---------- audio (tiny, starts on first interaction) ----------
  var AC = null;
  function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); }
  function tone(f, t0, d, type, g){
    if(!AC) return;
    var o = AC.createOscillator(), gn = AC.createGain();
    o.type = type||'sine'; o.frequency.value = f;
    gn.gain.setValueAtTime(g||0.12, AC.currentTime+t0);
    gn.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+t0+d);
    o.connect(gn); gn.connect(AC.destination);
    o.start(AC.currentTime+t0); o.stop(AC.currentTime+t0+d);
  }
  function sndLotus(){ tone(880,0,0.12,'sine',0.10); tone(1318,0.07,0.16,'sine',0.08); }
  function sndJump(){ tone(300,0,0.10,'triangle',0.05); }
  function sndDie(){ tone(160,0,0.25,'sawtooth',0.10); tone(90,0.05,0.35,'sawtooth',0.08); }

  // ---------- state ----------
  var state = 'menu'; // menu | play | over
  var cam = 0, speed = 5.2, dist = 0, lotus = 0, score = 0;
  var best = parseInt(localStorage.getItem('setuBest')||'0',10) || 0;
  var frame = 0, shake = 0;
  var player = { x:120, y:GROUND-54, w:36, h:54, vy:0, jumps:0, run:0 };
  var stones = [], rocks = [], birds = [], flowers = [], parts = [];
  var nextStoneX = 0, nextRockIn = 0, nextBirdIn = 0, nextFlowerIn = 0;

  function reset(){
    cam = 0; speed = 5.2; dist = 0; lotus = 0; score = 0; frame = 0; shake = 0;
    player.y = GROUND-54; player.vy = 0; player.jumps = 0;
    stones = []; rocks = []; birds = []; flowers = []; parts = [];
    nextStoneX = -100; nextRockIn = 500; nextBirdIn = 900; nextFlowerIn = 350;
    genWorld(true);
  }

  function genWorld(first){
    while(nextStoneX < cam + W + 300){
      var w = 260 + Math.random()*340;
      stones.push({ x: nextStoneX, w: w });
      nextStoneX += w;
      if(!first || nextStoneX > 700){
        if(Math.random() < 0.75) nextStoneX += 95 + Math.random()*85; // gap
      }
    }
    while(nextRockIn < cam + W + 300){
      var rx = nextRockIn;
      var st = stoneAt(rx + 20);
      if(st) rocks.push({ x: rx, y: GROUND-30, w: 36, h: 30, seed: Math.random()*7 });
      nextRockIn += 430 + Math.random()*520;
    }
    while(nextBirdIn < cam + W + 300){
      birds.push({ x: nextBirdIn, y: 150 + Math.random()*150, ph: Math.random()*7, sp: 1 + Math.random()*1.4 });
      nextBirdIn += 800 + Math.random()*900;
    }
    while(nextFlowerIn < cam + W + 300){
      var fx = nextFlowerIn;
      if(stoneAt(fx)) flowers.push({ x: fx, y: GROUND - 95 - Math.random()*45, got:false, ph: Math.random()*7 });
      nextFlowerIn += 380 + Math.random()*420;
    }
    stones = stones.filter(function(s){ return s.x + s.w > cam - 200; });
    rocks = rocks.filter(function(r){ return r.x > cam - 100; });
    birds = birds.filter(function(b){ return b.x > cam - 120; });
    flowers = flowers.filter(function(f){ return f.x > cam - 100 && !f.got; });
  }

  function stoneAt(wx){
    for(var i=0;i<stones.length;i++){ if(wx >= stones[i].x && wx <= stones[i].x + stones[i].w) return stones[i]; }
    return null;
  }

  function jump(){
    audio();
    if(state === 'menu'){ state = 'play'; return; }
    if(state === 'over'){ reset(); state = 'play'; return; }
    if(player.jumps < 2){
      player.vy = player.jumps === 0 ? -13.2 : -11.6;
      player.jumps++; player.run = 0; sndJump();
      burst(player.x+18, player.y+player.h, 5, '#e8d9b0');
    }
  }

  function die(){
    if(state !== 'play') return;
    state = 'over'; shake = 14; sndDie();
    burst(player.x+18, player.y+26, 22, '#e2725b');
    score = Math.floor(dist/10) + lotus*25;
    if(score > best){ best = score; localStorage.setItem('setuBest', String(best)); }
  }

  function burst(x, y, n, color){
    for(var i=0;i<n;i++){
      parts.push({ x:x, y:y, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.7)*5, life:26+Math.random()*14, color:color, r:2+Math.random()*3 });
    }
  }

  // ---------- update ----------
  function update(){
    frame++;
    if(state !== 'play') { updateParts(); return; }
    speed = Math.min(10.6, speed + 0.0022);
    cam += speed; dist += speed;
    genWorld(false);

    // player physics
    player.vy += 0.62;
    player.y += player.vy;
    var feet = player.y + player.h;
    var st = stoneAt(cam + player.x + player.w/2);
    if(st && player.vy >= 0 && feet >= GROUND && feet - player.vy <= GROUND + 14){
      player.y = GROUND - player.h; player.vy = 0; player.jumps = 0;
    }
    if(player.y > H + 60){ die(); }
    player.run += speed * 0.045;

    // birds drift toward player
    for(var i=0;i<birds.length;i++){ birds[i].x -= 1.1 * birds[i].sp; birds[i].ph += 0.12; }

    // collisions
    var px = cam + player.x, py = player.y;
    for(var j=0;j<rocks.length;j++){
      var r = rocks[j];
      if(px+30 > r.x && px+6 < r.x + r.w && py + player.h > r.y + 8 && py < r.y + r.h){ die(); return; }
    }
    for(var k=0;k<birds.length;k++){
      var b = birds[k], by = b.y + Math.sin(b.ph)*10;
      if(px+32 > b.x && px+4 < b.x + 44 && py+8 < by + 22 && py + player.h - 6 > by){ die(); return; }
    }
    for(var m=0;m<flowers.length;m++){
      var f = flowers[m];
      if(!f.got && Math.abs((px+18) - f.x) < 34 && Math.abs((py+26) - f.y) < 42){
        f.got = true; lotus++; sndLotus(); burst(f.x - cam, f.y, 10, '#f6b8d0');
      }
    }
    score = Math.floor(dist/10) + lotus*25;
    updateParts();
    if(shake > 0) shake--;
  }

  function updateParts(){
    for(var i=parts.length-1;i>=0;i--){
      var p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life--;
      if(p.life <= 0) parts.splice(i,1);
    }
  }

  // ---------- drawing ----------
  function draw(){
    ctx.save();
    if(shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

    // sky
    var sky = ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#2a1450'); sky.addColorStop(0.45,'#7a2d5e');
    sky.addColorStop(0.72,'#e2603f'); sky.addColorStop(1,'#f7b733');
    ctx.fillStyle = sky; ctx.fillRect(-20,-20,W+40,H+40);

    // sun
    var sx = W*0.72 - (cam*0.02 % 40), sy = 300;
    var glow = ctx.createRadialGradient(sx,sy,10,sx,sy,150);
    glow.addColorStop(0,'rgba(255,214,120,0.95)'); glow.addColorStop(0.25,'rgba(255,170,80,0.55)'); glow.addColorStop(1,'rgba(255,150,60,0)');
    ctx.fillStyle = glow; ctx.fillRect(sx-160,sy-160,320,320);
    ctx.fillStyle = '#ffd678'; ctx.beginPath(); ctx.arc(sx,sy,42,0,7); ctx.fill();

    // clouds (parallax)
    ctx.fillStyle = 'rgba(255,190,160,0.5)';
    for(var c=0;c<5;c++){
      var cx = ((c*260 + 80 - cam*0.15) % (W+240) + W+240) % (W+240) - 120;
      var cy = 56 + (c%3)*44;
      cloud(cx, cy, 34 + (c%2)*14);
    }

    // Lanka silhouette (parallax)
    ctx.fillStyle = 'rgba(43,18,54,0.85)';
    var lx = W - 330 - (cam*0.05 % 30);
    ctx.beginPath();
    ctx.moveTo(lx, GROUND); ctx.lineTo(lx, 330); ctx.lineTo(lx+40, 330); ctx.lineTo(lx+40, 292);
    ctx.lineTo(lx+62, 268); ctx.lineTo(lx+84, 292); ctx.lineTo(lx+84, 330); ctx.lineTo(lx+150, 330);
    ctx.lineTo(lx+150, 306); ctx.lineTo(lx+172, 284); ctx.lineTo(lx+194, 306); ctx.lineTo(lx+194, GROUND);
    ctx.closePath(); ctx.fill();
    // distant hills
    ctx.fillStyle = 'rgba(58,24,66,0.6)';
    ctx.beginPath(); ctx.moveTo(-20, GROUND);
    for(var hx=-20; hx<=W+20; hx+=40){
      var hy = GROUND - 26 - Math.abs(Math.sin((hx + cam*0.3)*0.011))*54;
      ctx.lineTo(hx, hy);
    }
    ctx.lineTo(W+20, GROUND); ctx.closePath(); ctx.fill();

    // sea
    var sea = ctx.createLinearGradient(0,GROUND,0,H);
    sea.addColorStop(0,'#274b73'); sea.addColorStop(1,'#101f3c');
    ctx.fillStyle = sea; ctx.fillRect(-20, GROUND, W+40, H-GROUND+20);
    ctx.strokeStyle = 'rgba(255,205,140,0.35)'; ctx.lineWidth = 2;
    for(var wv=0; wv<3; wv++){
      ctx.beginPath();
      var wy = GROUND + 22 + wv*24;
      for(var wx=-20; wx<=W+20; wx+=16){
        var yy = wy + Math.sin((wx + cam*(0.7+wv*0.25) + frame*(1+wv*0.4))*0.05)*3;
        if(wx === -20) ctx.moveTo(wx,yy); else ctx.lineTo(wx,yy);
      }
      ctx.stroke();
    }
    // sun path on water
    ctx.fillStyle = 'rgba(255,190,90,0.16)';
    ctx.fillRect(sx-26, GROUND, 52, H-GROUND);

    // stones of Ram Setu
    for(var i=0;i<stones.length;i++){
      var s = stones[i], vx = s.x - cam;
      if(vx + s.w < -40 || vx > W+40) continue;
      var bob = Math.sin(frame*0.03 + s.x*0.01)*2;
      ctx.fillStyle = '#8a6f4d';
      roundRect(vx, GROUND-12+bob, s.w, 20, 8); ctx.fill();
      ctx.fillStyle = '#a5855c';
      roundRect(vx, GROUND-16+bob, s.w, 12, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,200,0.5)';
      ctx.font = '11px Georgia'; ctx.textAlign = 'center';
      if(s.w > 150) ctx.fillText('।। राम ।।', vx + s.w/2, GROUND - 3 + bob);
    }

    // lotus flowers
    for(var f=0;f<flowers.length;f++){
      var fl = flowers[f]; if(fl.got) continue;
      var fx = fl.x - cam; if(fx < -40 || fx > W+40) continue;
      var fy = fl.y + Math.sin(frame*0.05 + fl.ph)*4;
      drawLotus(fx, fy);
    }

    // rocks
    for(var r2=0;r2<rocks.length;r2++){
      var rk = rocks[r2], rx2 = rk.x - cam;
      if(rx2 < -60 || rx2 > W+60) continue;
      ctx.fillStyle = '#4c4238';
      ctx.beginPath();
      ctx.moveTo(rx2, GROUND); ctx.lineTo(rx2+6, GROUND-22);
      ctx.lineTo(rx2+16, GROUND-30); ctx.lineTo(rx2+28, GROUND-24);
      ctx.lineTo(rx2+rk.w, GROUND); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.beginPath(); ctx.moveTo(rx2+10, GROUND-20); ctx.lineTo(rx2+16, GROUND-28); ctx.lineTo(rx2+22, GROUND-20); ctx.closePath(); ctx.fill();
    }

    // demon birds
    for(var b2=0;b2<birds.length;b2++){
      var bd = birds[b2], bx = bd.x - cam, by2 = bd.y + Math.sin(bd.ph)*10;
      if(bx < -70 || bx > W+70) continue;
      drawBird(bx, by2, bd.ph);
    }

    // particles
    for(var p=0;p<parts.length;p++){
      var pt = parts[p];
      ctx.globalAlpha = Math.max(0, pt.life/30);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // player
    drawRam(player.x, player.y, state==='play' ? player.run : frame*0.12, player.vy);

    // HUD
    ctx.fillStyle = 'rgba(20,8,30,0.45)';
    roundRect(14, 14, 252, 58, 10); ctx.fill();
    ctx.fillStyle = '#ffe9b8'; ctx.font = 'bold 20px Georgia'; ctx.textAlign = 'left';
    ctx.fillText('Score  ' + score, 26, 40);
    ctx.font = '14px Georgia'; ctx.fillStyle = '#ffd2e0';
    ctx.fillText('Lotus ' + lotus + '    Best ' + Math.max(best, score), 26, 62);

    if(state === 'menu') panel('Ramayana: Setu Runner', 'The stones float because they carry Ram\u2019s name.', 'Tap or press Space to begin');
    if(state === 'over') panel('The run ends here', 'Score ' + score + '   |   Lotus ' + lotus + '   |   Best ' + best, 'Tap or press Space to run again');

    ctx.restore();
  }

  function panel(title, line1, line2){
    ctx.fillStyle = 'rgba(24,10,36,0.72)';
    roundRect(W/2-280, 168, 560, 168, 16); ctx.fill();
    ctx.strokeStyle = '#d9a441'; ctx.lineWidth = 2;
    roundRect(W/2-280, 168, 560, 168, 16); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd678'; ctx.font = '30px Georgia';
    ctx.fillText(title, W/2, 222);
    ctx.fillStyle = '#f3e5c8'; ctx.font = '16.5px Georgia';
    ctx.fillText(line1, W/2, 258);
    ctx.fillStyle = '#d9a441'; ctx.font = 'bold 16px Georgia';
    ctx.fillText(line2, W/2, 296);
  }

  function cloud(x, y, r){
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 7); ctx.arc(x+r*0.8, y+4, r*0.72, 0, 7); ctx.arc(x-r*0.8, y+5, r*0.66, 0, 7);
    ctx.fill();
  }

  function drawLotus(x, y){
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#f191b8';
    for(var i=-2;i<=2;i++){
      ctx.save(); ctx.rotate(i*0.42);
      ctx.beginPath(); ctx.ellipse(0, -8, 5.5, 11, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath(); ctx.arc(0, 0, 4.4, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawBird(x, y, ph){
    var flap = Math.sin(ph*2.2)*8;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#33222e';
    ctx.beginPath(); ctx.ellipse(20, 10, 20, 9, 0, 0, 7); ctx.fill(); // body
    ctx.beginPath(); ctx.arc(38, 5, 8, 0, 7); ctx.fill(); // head
    ctx.fillStyle = '#e8b13c';
    ctx.beginPath(); ctx.moveTo(45, 3); ctx.lineTo(54, 6); ctx.lineTo(45, 9); ctx.closePath(); ctx.fill(); // beak
    ctx.fillStyle = '#241722';
    ctx.beginPath(); ctx.moveTo(14, 6); ctx.lineTo(-8, -4 - flap); ctx.lineTo(2, 12); ctx.closePath(); ctx.fill(); // wing far
    ctx.beginPath(); ctx.moveTo(22, 6); ctx.lineTo(4, -10 - flap); ctx.lineTo(12, 12); ctx.closePath(); ctx.fill(); // wing near
    ctx.fillStyle = '#ffdf6b';
    ctx.beginPath(); ctx.arc(40, 4, 2.2, 0, 7); ctx.fill(); // eye
    ctx.restore();
  }

  function drawRam(x, y, runPh, vy){
    var legA = Math.sin(runPh)*9, legB = Math.sin(runPh+Math.PI)*9;
    var air = vy !== 0;
    ctx.save(); ctx.translate(x, y);
    // legs (dhoti + legs)
    ctx.strokeStyle = '#8a4b21'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(18, 36); ctx.lineTo(18 + (air? 6 : legA), 52); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(18, 36); ctx.lineTo(18 + (air? -4 : legB), 52); ctx.stroke();
    // dhoti
    ctx.fillStyle = '#f39c2c';
    ctx.beginPath(); ctx.moveTo(8, 22); ctx.lineTo(29, 22); ctx.lineTo(27, 40); ctx.lineTo(10, 40); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#d9821e'; ctx.fillRect(8, 22, 21, 4);
    // torso
    ctx.fillStyle = '#a05a2c';
    roundRect(9, 4, 19, 20, 6); ctx.fill();
    // sacred thread
    ctx.strokeStyle = '#fff3d6'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(11, 6); ctx.lineTo(26, 22); ctx.stroke();
    // arm holding bow forward
    ctx.strokeStyle = '#8a4b21'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(24, 10); ctx.lineTo(36, 14); ctx.stroke();
    // bow
    ctx.strokeStyle = '#7a4a12'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(40, 12, 17, -1.25, 1.25); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(40 + Math.cos(-1.25)*17, 12 + Math.sin(-1.25)*17);
    ctx.lineTo(40 + Math.cos(1.25)*17, 12 + Math.sin(1.25)*17);
    ctx.stroke();
    // head
    ctx.fillStyle = '#b06a33';
    ctx.beginPath(); ctx.arc(18, -3, 8.5, 0, 7); ctx.fill();
    // hair + mukut (crown)
    ctx.fillStyle = '#241407';
    ctx.beginPath(); ctx.arc(17, -6, 8, Math.PI*0.95, Math.PI*1.95); ctx.fill();
    ctx.fillStyle = '#e8b13c';
    ctx.beginPath(); ctx.moveTo(11, -11); ctx.lineTo(15, -19); ctx.lineTo(19, -12); ctx.lineTo(23, -19); ctx.lineTo(26, -11); ctx.closePath(); ctx.fill();
    // quiver on back
    ctx.fillStyle = '#6d3f14';
    roundRect(1, 2, 6, 16, 3); ctx.fill();
    ctx.strokeStyle = '#e8b13c'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(4, 2); ctx.lineTo(1, -6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, 2); ctx.lineTo(5, -7); ctx.stroke();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  // ---------- loop ----------
  function loop(){ update(); draw(); requestAnimationFrame(loop); }
  reset();
  requestAnimationFrame(loop);

  // ---------- input ----------
  function press(e){ if(e) e.preventDefault(); jump(); }
  cv.addEventListener('pointerdown', press);
      window.addEventListener('keydown', function(e){
    if(e.code === 'Space' || e.code === 'ArrowUp'){ press(e); }
    if(e.code === 'KeyR' && state === 'over'){ reset(); state = 'play'; }
  });
})();
</script>
</body>
</html>
