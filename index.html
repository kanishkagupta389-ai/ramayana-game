<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ramayana: Setu Runner — SkyRoket Productions</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    padding:0; margin:0; background:#1d1033; overflow:hidden;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#2a1450 0%,#7a2d5e 45%,#274b73 82%,#101f3c 100%); }
  canvas {
    width:min(100vw, 177.78vh); height:min(56.25vw, 100vh); display:block; border-radius:0;
    box-shadow:none;
    background:#2a1450; touch-action:none; cursor:pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
</div>
<script>
(function () {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = 960, H = 540;

  // Crisp rendering on retina / high-DPI screens, same game coordinates.
  function fitCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  var SEA = 468;            // y of the sea line
  var STONE_Y = 430;        // top surface of the floating stones
  var GRAV = 0.62, JUMP = -13.2, JUMP2 = -11.6;

  var state = 'menu';       // menu | play | pause | over
  var cam = 0, dist = 0, speed = 6.2;
  var lotusPts = 0, smashPts = 0, lotusCount = 0;
  var combo = 0, comboT = 0;
  var divineT = 0;
  var overT = 0, newBest = false;
  var banner = null, bannerT = 0, nextMilestone = 250;
  var best = parseInt(localStorage.getItem('setu_best') || '0', 10) || 0;
  var muted = localStorage.getItem('setu_muted') === '1';

  var player = { x: 150, y: STONE_Y - 46, vy: 0, jumps: 0, run: 0, onGround: true };
  var stones = [], rocks = [], birds = [], lotuses = [], arrows = [], parts = [];
  var clouds = [], stars = [];
  var buttons = [];   // active on-canvas buttons {x,y,w,h,action,label,primary}

  for (var i = 0; i < 40; i++) stars.push({ x: Math.random() * W, y: Math.random() * 200, r: Math.random() * 1.4 + 0.4, p: Math.random() * 6.28 });
  for (var j = 0; j < 7; j++) clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 120, s: 0.6 + Math.random() * 0.9, v: 0.08 + Math.random() * 0.15 });

  // ---------- audio ----------
  var AC = null;
  function tone(f, t, d, type, vol, slide) {
    if (muted) return;
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime;
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, n);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, n + d);
      g.gain.setValueAtTime(vol || 0.05, n);
      g.gain.exponentialRampToValueAtTime(0.0001, n + d);
      o.connect(g); g.connect(AC.destination);
      o.start(n + (t || 0)); o.stop(n + (t || 0) + d + 0.02);
    } catch (e) {}
  }
  var sfx = {
    jump: function () { tone(420, 0, 0.12, 'sine', 0.045, 760); },
    lotus: function () { tone(880, 0, 0.12, 'sine', 0.05); tone(1318, 0.07, 0.18, 'sine', 0.045); },
    smash: function () { tone(160, 0, 0.16, 'square', 0.05, 60); },
    divine: function () { tone(523, 0, 0.12, 'triangle', 0.06); tone(784, 0.09, 0.14, 'triangle', 0.06); tone(1046, 0.18, 0.22, 'triangle', 0.06); },
    over: function () { tone(392, 0, 0.2, 'sine', 0.05); tone(311, 0.18, 0.24, 'sine', 0.05); tone(233, 0.38, 0.4, 'sine', 0.05); }
  };

  // ---------- world generation ----------
  var genX = 0;
  function addStone(x) {
    var w = 110 + Math.random() * 130;
    stones.push({ x: x, w: w, ph: Math.random() * 6.28 });
    if (Math.random() < 0.30) rocks.push({ x: x + 30 + Math.random() * (w - 60), r: 13 + Math.random() * 8, seed: Math.random() * 10 });
    if (Math.random() < 0.34) lotuses.push({ x: x + w * (0.3 + Math.random() * 0.4), y: STONE_Y - 92 - Math.random() * 46, got: false, ph: Math.random() * 6.28 });
    genX = x + w;
    if (Math.random() < 0.17) genX += 88 + Math.random() * 46;   // a gap to leap
  }
  function reset() {
    cam = 0; dist = 0; speed = 6.2; lotusPts = 0; smashPts = 0; lotusCount = 0;
    combo = 0; comboT = 0; divineT = 0; overT = 0; newBest = false;
    banner = null; bannerT = 0; nextMilestone = 250;
    player.y = STONE_Y - 46; player.vy = 0; player.jumps = 0; player.onGround = true;
    stones = []; rocks = []; birds = []; lotuses = []; arrows = []; parts = [];
    genX = -60;
    while (genX < W + 500) addStone(genX);
  }
  function stoneYAt(wx) {
    for (var i = 0; i < stones.length; i++) {
      var s = stones[i];
      if (wx >= s.x - 4 && wx <= s.x + s.w + 4) return STONE_Y + Math.sin(cam * 0.02 + s.ph) * 2.5;
    }
    return null;
  }
  function burst(x, y, color, n, spd) {
    for (var i = 0; i < n; i++) {
      if (parts.length > 220) break;
      var a = Math.random() * 6.28, v = (0.4 + Math.random() * 0.6) * (spd || 2.4);
      parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.6, life: 26 + Math.random() * 22, max: 48, color: color, r: 1.6 + Math.random() * 2.4 });
    }
  }

  // ---------- input ----------
  function toGame(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }
  function jump() {
    if (player.jumps < 2) {
      player.vy = player.jumps === 0 ? JUMP : JUMP2;
      player.jumps++; player.onGround = false;
      burst(player.x + 6, player.y + 46, '#e8d9b0', 5, 1.6);
      sfx.jump();
    }
  }
  function pressAt(p) {
    for (var i = 0; i < buttons.length; i++) {
      var b = buttons[i];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { doAction(b.action); return true; }
    }
    return false;
  }
  function doAction(a) {
    if (a === 'pause') { if (state === 'play') state = 'pause'; }
    else if (a === 'resume') { if (state === 'pause') state = 'play'; }
    else if (a === 'sound') { muted = !muted; localStorage.setItem('setu_muted', muted ? '1' : '0'); }
    else if (a === 'restart') { reset(); state = 'play'; }
    else if (a === 'menu') { reset(); state = 'menu'; }
    else if (a === 'start') { reset(); state = 'play'; }
  }
  function tap(e) {
    var p = toGame(e);
    if (pressAt(p)) return;
    if (state === 'menu') { reset(); state = 'play'; }
    else if (state === 'play') jump();
    else if (state === 'pause') state = 'play';
    // on 'over', only the buttons act: no accidental restarts
  }
  canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); tap(e); });
  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (state === 'menu') { reset(); state = 'play'; }
      else if (state === 'play') jump();
      else if (state === 'over' && overT > 40) { reset(); state = 'play'; }
      else if (state === 'pause') state = 'play';
    }
    if (e.code === 'KeyR' && (state === 'over' || state === 'pause')) { reset(); state = 'play'; }
    if (e.code === 'KeyP') { if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play'; }
    if (e.code === 'KeyM') doAction('sound');
    if (e.code === 'Escape' && state === 'over') { reset(); state = 'menu'; }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden && state === 'play') state = 'pause'; });

  function gameOver() {
    state = 'over'; overT = 0;
    var total = score();
    if (total > best) { best = total; newBest = true; localStorage.setItem('setu_best', String(best)); }
    sfx.over();
  }
  function score() { return Math.floor(dist / 10) + lotusPts + smashPts; }

  // ---------- update ----------
  function update(dt) {
    var i, o;
    for (i = 0; i < clouds.length; i++) { clouds[i].x -= clouds[i].v * dt; if (clouds[i].x < -170) { clouds[i].x = W + 30; clouds[i].y = 26 + Math.random() * 120; } }
    for (i = 0; i < parts.length; i++) { var q = parts[i]; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 0.05 * dt; q.life -= dt; }
    parts = parts.filter(function (q) { return q.life > 0; });
    if (bannerT > 0) bannerT -= dt;

    if (state === 'menu') { cam += 0.7 * dt; return; }
    if (state !== 'play') { if (state === 'over') overT += dt; return; }

    dist += speed * dt;
    cam += speed * dt;
    speed = Math.min(11.5, 6.2 + dist / 5200);
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
    if (divineT > 0) divineT -= dt;

    var m = Math.floor(dist / 10);
    if (m >= nextMilestone) {
      banner = nextMilestone >= 1000 ? nextMilestone + ' m — Lanka is in sight!' : nextMilestone + ' m across the sea';
      bannerT = 170; nextMilestone = nextMilestone < 1000 ? nextMilestone + 250 : nextMilestone + 500;
    }

    while (genX < cam + W + 500) addStone(genX);
    if (Math.random() < 0.0062 * dt && birds.length < 3) birds.push({ x: cam + W + 60, y: 120 + Math.random() * 150, ph: Math.random() * 6.28, sp: 1.1 + Math.random() * 0.9 });
    if (Math.random() < 0.0016 * dt && divineT <= 0) arrows.push({ x: cam + W + 60, y: STONE_Y - 120 - Math.random() * 60, ph: 0 });

    stones = stones.filter(function (s) { return s.x + s.w > cam - 120; });
    rocks = rocks.filter(function (r) { return r.x > cam - 80; });
    lotuses = lotuses.filter(function (l) { return l.x > cam - 60 && !l.got; });
    arrows = arrows.filter(function (a) { return a.x > cam - 60; });

    // player physics
    player.vy += GRAV * dt;
    player.y += player.vy * dt;
    var feet = player.y + 46, wx = cam + player.x;
    var sy = stoneYAt(wx);
    if (sy !== null && feet >= sy && player.vy >= 0 && feet - player.vy * dt <= sy + 14) {
      if (!player.onGround && player.vy > 5) burst(player.x + 4, sy, '#d9c491', 6, 1.5);
      player.y = sy - 46; player.vy = 0; player.jumps = 0; player.onGround = true;
    } else player.onGround = false;
    player.run += (player.onGround ? speed * 0.052 : 0.012) * dt;
    if (player.onGround && Math.random() < 0.3 * dt) parts.push({ x: player.x - 8, y: player.y + 45, vx: -0.7, vy: -0.4, life: 16, max: 16, color: '#e6d3a3', r: 2 });
    if (feet > H + 70) { gameOver(); return; }

    // birds
    for (i = 0; i < birds.length; i++) {
      o = birds[i]; o.x -= (speed * 0.55 + o.sp) * dt; o.ph += 0.16 * dt;
      var bx = o.x - cam, by = o.y + Math.sin(o.ph * 0.7) * 7;
      if (Math.abs(bx - player.x) < 34 && Math.abs(by - (player.y + 20)) < 32) {
        if (divineT > 0) { burst(bx, by, '#ffb84d', 16, 3); smashPts += 15; birds.splice(i, 1); i--; sfx.smash(); }
        else { gameOver(); return; }
      }
    }
    birds = birds.filter(function (b) { return b.x - cam > -80; });

    // rocks
    for (i = 0; i < rocks.length; i++) {
      o = rocks[i]; var rx = o.x - cam;
      if (rx > -40 && rx < W + 40 && Math.abs(rx - player.x) < 26 && feet > STONE_Y - o.r * 1.5) {
        if (divineT > 0) { burst(rx, STONE_Y - 10, '#ffb84d', 14, 3); smashPts += 15; rocks.splice(i, 1); i--; sfx.smash(); }
        else { gameOver(); return; }
      }
    }

    // lotuses
    for (i = 0; i < lotuses.length; i++) {
      o = lotuses[i]; var lx = o.x - cam;
      if (!o.got && Math.abs(lx - player.x) < 36 && Math.abs(o.y - (player.y + 18)) < 42) {
        o.got = true; combo = Math.min(combo + 1, 8); comboT = 240;
        var pts = 25 + (combo - 1) * 5; lotusPts += pts; lotusCount++;
        burst(lx, o.y, '#ff9ec7', 12, 2.2); sfx.lotus();
      }
    }

    // golden arrows: divine mode
    for (i = 0; i < arrows.length; i++) {
      o = arrows[i]; var ax = o.x - cam; o.ph += 0.08 * dt;
      if (Math.abs(ax - player.x) < 38 && Math.abs(o.y - (player.y + 18)) < 44) {
        divineT = 320; burst(ax, o.y, '#ffd75e', 20, 3); arrows.splice(i, 1); i--; sfx.divine();
      }
    }
  }

  // ---------- drawing ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawLotus(x, y, s, glow) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    if (glow) { var g = ctx.createRadialGradient(0, 0, 2, 0, 0, 26); g.addColorStop(0, 'rgba(255,170,210,0.55)'); g.addColorStop(1, 'rgba(255,170,210,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 26, 0, 6.29); ctx.fill(); }
    ctx.fillStyle = '#ff8fbf';
    var petals = [[-11, 2, -0.6], [-5.5, -3.5, -0.28], [0, -6, 0], [5.5, -3.5, 0.28], [11, 2, 0.6]];
    for (var i = 0; i < petals.length; i++) {
      ctx.save(); ctx.translate(petals[i][0], petals[i][1]); ctx.rotate(petals[i][2]);
      ctx.beginPath(); ctx.moveTo(0, -9); ctx.quadraticCurveTo(5.5, 0, 0, 8); ctx.quadraticCurveTo(-5.5, 0, 0, -9); ctx.fill(); ctx.restore();
    }
    ctx.fillStyle = '#ffd75e'; ctx.beginPath(); ctx.arc(0, 1, 3.4, 0, 6.29); ctx.fill();
    ctx.restore();
  }
  function drawBird(x, y, ph) {
    var f = Math.sin(ph) * 9;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#241a33';
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.quadraticCurveTo(-26, -13 - f, -40, -4 - f); ctx.quadraticCurveTo(-24, 2, -6, 5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.quadraticCurveTo(24, -15 - f, 38, -6 - f); ctx.quadraticCurveTo(22, 3, 8, 5); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 2, 14, 9, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(15, -3, 7.5, 0, 6.29); ctx.fill();
    ctx.strokeStyle = '#4a3566'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(11, -9); ctx.quadraticCurveTo(13, -15, 17, -16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(18, -9); ctx.quadraticCurveTo(21, -14, 25, -14); ctx.stroke();
    ctx.fillStyle = '#ffb84d'; ctx.beginPath(); ctx.moveTo(21, -3); ctx.lineTo(30, -0.5); ctx.lineTo(21, 2); ctx.fill();
    ctx.fillStyle = '#ff4747'; ctx.beginPath(); ctx.arc(16.5, -4.5, 1.9, 0, 6.29); ctx.fill();
    ctx.restore();
  }
  function drawRam(x, y, running, t) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(30,16,50,0.25)';
    ctx.beginPath(); ctx.ellipse(2, 47, 20, 4.5, 0, 0, 6.29); ctx.fill();
    var legA = running ? Math.sin(player.run) * 10 : 0;
    var legB = running ? Math.sin(player.run + 3.14) * 10 : 0;
    ctx.strokeStyle = '#8a5a34'; ctx.lineWidth = 5.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-2, 24); ctx.lineTo(-2 + legA, 44); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5, 24); ctx.lineTo(5 + legB, 44); ctx.stroke();
    ctx.fillStyle = '#f7ead2';
    ctx.beginPath(); ctx.moveTo(-9, 8); ctx.lineTo(12, 8); ctx.lineTo(10, 27); ctx.lineTo(-7, 27); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#d9a441'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = '#e2543e'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(8, -8);
    ctx.quadraticCurveTo(-8 - Math.sin(t * 0.14) * 3, -2, -19 - Math.sin(t * 0.14 + 1) * 4, 7 + Math.cos(t * 0.11) * 3);
    ctx.stroke();
    ctx.fillStyle = '#a06a3c'; rr(-8, -12, 19, 22, 6); ctx.fill();
    ctx.save(); ctx.translate(-11, -6); ctx.rotate(0.5);
    ctx.fillStyle = '#6d4423'; rr(-3.4, -8, 7, 18, 3); ctx.fill();
    ctx.strokeStyle = '#c9ced6'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(0, -15); ctx.moveTo(3, -7); ctx.lineTo(4.5, -14); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = '#8a5a34'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(8, -6); ctx.lineTo(21, -2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, 2); ctx.lineTo(15, 8); ctx.stroke();
    ctx.strokeStyle = '#5d3a1a'; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.arc(24, -2, 21, -1.25, 1.25); ctx.stroke();
    ctx.strokeStyle = 'rgba(240,240,240,0.85)'; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(24 + 21 * Math.cos(-1.25), -2 + 21 * Math.sin(-1.25)); ctx.lineTo(24 + 21 * Math.cos(1.25), -2 + 21 * Math.sin(1.25)); ctx.stroke();
    ctx.strokeStyle = '#d9d9d9'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(12, -2); ctx.lineTo(33, -2); ctx.stroke();
    ctx.fillStyle = '#ffd75e'; ctx.beginPath(); ctx.moveTo(37, -2); ctx.lineTo(31, -4.6); ctx.lineTo(31, 0.6); ctx.fill();
    ctx.fillStyle = '#3a2415'; ctx.beginPath(); ctx.arc(3, -24, 5, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#b57a48'; ctx.beginPath(); ctx.arc(2, -16, 8.6, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#2e1c10';
    ctx.beginPath(); ctx.arc(2, -21.5, 8.8, 3.35, 6.1); ctx.lineTo(2, -26); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fff4d6'; ctx.lineWidth = 1.7;
    ctx.beginPath(); ctx.moveTo(6.5, -21); ctx.lineTo(6.5, -14.5); ctx.stroke();
    ctx.fillStyle = '#e2543e'; ctx.beginPath(); ctx.arc(6.5, -13.4, 1.15, 0, 6.29); ctx.fill();
    if (divineT > 0) {
      ctx.strokeStyle = 'rgba(255,215,94,' + (0.55 + Math.sin(t * 0.3) * 0.25) + ')';
      ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(4, 8, 40, 0, 6.29); ctx.stroke();
    }
    ctx.restore();
  }
  function drawWorld(t) {
    var i, o, x, y;
    var sky = ctx.createLinearGradient(0, 0, 0, SEA);
    sky.addColorStop(0, '#2a1450'); sky.addColorStop(0.42, '#7a2d5e'); sky.addColorStop(0.75, '#e2603f'); sky.addColorStop(1, '#f7a54a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, SEA);
    ctx.fillStyle = '#fff';
    for (i = 0; i < stars.length; i++) { var st = stars[i]; ctx.globalAlpha = 0.35 + 0.3 * Math.sin(t * 0.03 + st.p); ctx.fillRect(st.x, st.y, st.r, st.r); }
    ctx.globalAlpha = 1;
    var sg = ctx.createRadialGradient(700, 392, 8, 700, 392, 120);
    sg.addColorStop(0, 'rgba(255,214,120,0.85)'); sg.addColorStop(0.35, 'rgba(255,170,80,0.35)'); sg.addColorStop(1, 'rgba(255,170,80,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(700, 392, 120, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#ffd678'; ctx.beginPath(); ctx.arc(700, 392, 40, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#ffe9ad'; ctx.beginPath(); ctx.arc(700, 392, 31, 0, 6.29); ctx.fill();
    ctx.fillStyle = 'rgba(46,22,64,0.55)';
    ctx.beginPath(); ctx.moveTo(0, SEA);
    for (x = 0; x <= W; x += 16) { var hx = x + cam * 0.14; ctx.lineTo(x, SEA - 26 - Math.sin(hx * 0.011) * 13 - Math.sin(hx * 0.0037) * 9); }
    ctx.lineTo(W, SEA); ctx.closePath(); ctx.fill();
    var lx = W - ((cam * 0.14) % 1400) + 900;
    ctx.fillStyle = 'rgba(34,16,50,0.8)';
    if (lx < W + 200) {
      ctx.fillRect(lx, SEA - 74, 74, 74);
      ctx.beginPath(); ctx.moveTo(lx - 8, SEA - 74); ctx.lineTo(lx + 37, SEA - 108); ctx.lineTo(lx + 82, SEA - 74); ctx.closePath(); ctx.fill();
      ctx.fillRect(lx + 24, SEA - 128, 26, 24);
      ctx.beginPath(); ctx.moveTo(lx + 20, SEA - 128); ctx.lineTo(lx + 37, SEA - 146); ctx.lineTo(lx + 54, SEA - 128); ctx.closePath(); ctx.fill();
    }
    for (i = 0; i < clouds.length; i++) {
      o = clouds[i]; ctx.save(); ctx.translate(o.x, o.y); ctx.scale(o.s, o.s);
      ctx.fillStyle = 'rgba(255,196,170,0.5)';
      ctx.beginPath(); ctx.ellipse(0, 0, 46, 13, 0, 0, 6.29); ctx.ellipse(30, -7, 32, 11, 0, 0, 6.29); ctx.ellipse(-32, -5, 28, 9, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = 'rgba(255,220,200,0.35)';
      ctx.beginPath(); ctx.ellipse(4, -6, 34, 9, 0, 0, 6.29); ctx.fill();
      ctx.restore();
    }
    var sea = ctx.createLinearGradient(0, SEA, 0, H);
    sea.addColorStop(0, '#3f6d9e'); sea.addColorStop(0.25, '#2c4f7e'); sea.addColorStop(1, '#101f3c');
    ctx.fillStyle = sea; ctx.fillRect(0, SEA, W, H - SEA);
    ctx.fillStyle = 'rgba(255,183,94,0.5)'; ctx.fillRect(0, SEA, W, 2.4);
    for (i = 0; i < 22; i++) {
      var sx = 620 + ((i * 97 + Math.floor(t * 0.7) * 13) % 210) - 30, sy2 = SEA + 8 + (i * 29) % 56;
      ctx.fillStyle = 'rgba(255,205,120,' + (0.14 + 0.12 * Math.sin(t * 0.09 + i * 1.7)) + ')';
      ctx.fillRect(sx, sy2, 16 + (i % 4) * 7, 2);
    }
    ctx.strokeStyle = 'rgba(190,220,255,0.20)'; ctx.lineWidth = 1.4;
    for (i = 0; i < 3; i++) {
      ctx.beginPath();
      for (x = 0; x <= W; x += 14) { var wy = SEA + 16 + i * 20 + Math.sin((x + cam * (0.5 + i * 0.22)) * 0.03 + i) * 2.6; if (x === 0) ctx.moveTo(x, wy); else ctx.lineTo(x, wy); }
      ctx.stroke();
    }
    for (i = 0; i < stones.length; i++) {
      o = stones[i]; x = o.x - cam; if (x + o.w < -20 || x > W + 20) continue;
      y = STONE_Y + Math.sin(cam * 0.02 + o.ph) * 2.5;
      var grd = ctx.createLinearGradient(0, y, 0, y + 44);
      grd.addColorStop(0, '#9a9186'); grd.addColorStop(0.5, '#7c7268'); grd.addColorStop(1, '#574e45');
      ctx.fillStyle = grd; rr(x, y, o.w, 46, 15); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,210,0.20)'; rr(x + 3, y + 2, o.w - 6, 9, 5); ctx.fill();
      ctx.strokeStyle = 'rgba(40,30,22,0.35)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x + o.w * 0.3, y + 14); ctx.lineTo(x + o.w * 0.42, y + 30); ctx.moveTo(x + o.w * 0.68, y + 10); ctx.lineTo(x + o.w * 0.6, y + 26); ctx.stroke();
      ctx.fillStyle = 'rgba(90,140,80,0.5)';
      ctx.beginPath(); ctx.ellipse(x + o.w * 0.2, y + 5, 9, 3, 0, 0, 6.29); ctx.ellipse(x + o.w * 0.82, y + 6, 7, 2.6, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#ffd98a'; ctx.font = 'bold 15px Georgia, serif'; ctx.textAlign = 'center';
      ctx.fillText('राम', x + o.w / 2, y + 26);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.ellipse(x + o.w / 2, y + 45, o.w * 0.42, 3.4 + Math.sin(t * 0.08 + o.ph) * 1.1, 0, 0, 6.29); ctx.fill();
    }
    for (i = 0; i < rocks.length; i++) {
      o = rocks[i]; x = o.x - cam; if (x < -40 || x > W + 40) continue;
      ctx.fillStyle = '#4c4239';
      ctx.beginPath(); ctx.moveTo(x - o.r, STONE_Y + 3); ctx.lineTo(x - o.r * 0.35, STONE_Y - o.r * 1.45); ctx.lineTo(x + o.r * 0.45, STONE_Y - o.r * 1.1); ctx.lineTo(x + o.r, STONE_Y + 3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,235,200,0.16)';
      ctx.beginPath(); ctx.moveTo(x - o.r * 0.35, STONE_Y - o.r * 1.45); ctx.lineTo(x + o.r * 0.45, STONE_Y - o.r * 1.1); ctx.lineTo(x + o.r * 0.2, STONE_Y - o.r * 0.4); ctx.lineTo(x - o.r * 0.15, STONE_Y - o.r * 0.6); ctx.closePath(); ctx.fill();
    }
    for (i = 0; i < lotuses.length; i++) { o = lotuses[i]; x = o.x - cam; if (x < -30 || x > W + 30) continue; drawLotus(x, o.y + Math.sin(t * 0.06 + o.ph) * 3.4, 1, true); }
    for (i = 0; i < arrows.length; i++) {
      o = arrows[i]; x = o.x - cam; if (x < -30 || x > W + 30) continue;
      ctx.save(); ctx.translate(x, o.y + Math.sin(t * 0.07 + o.ph) * 3); ctx.rotate(Math.sin(t * 0.05) * 0.14);
      var ag = ctx.createRadialGradient(0, 0, 2, 0, 0, 30); ag.addColorStop(0, 'rgba(255,215,94,0.6)'); ag.addColorStop(1, 'rgba(255,215,94,0)');
      ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(0, 0, 30, 0, 6.29); ctx.fill();
      ctx.strokeStyle = '#ffd75e'; ctx.lineWidth = 3.4;
      ctx.beginPath(); ctx.moveTo(-17, 0); ctx.lineTo(13, 0); ctx.stroke();
      ctx.fillStyle = '#ffe9ad'; ctx.beginPath(); ctx.moveTo(21, 0); ctx.lineTo(11, -5.4); ctx.lineTo(11, 5.4); ctx.fill();
      ctx.fillStyle = '#e2543e'; ctx.beginPath(); ctx.moveTo(-17, 0); ctx.lineTo(-24, -6); ctx.lineTo(-21, 0); ctx.lineTo(-24, 6); ctx.fill();
      ctx.restore();
    }
    for (i = 0; i < birds.length; i++) { o = birds[i]; drawBird(o.x - cam, o.y + Math.sin(o.ph * 0.7) * 7, o.ph); }
    for (i = 0; i < parts.length; i++) { o = parts[i]; ctx.globalAlpha = Math.max(0, o.life / o.max); ctx.fillStyle = o.color; ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 6.29); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  function drawPanel() {
    ctx.fillStyle = 'rgba(26,16,44,0.78)'; rr(18, 14, 252, 64, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(255,215,140,0.4)'; ctx.lineWidth = 1; rr(18, 14, 252, 64, 12); ctx.stroke();
    ctx.fillStyle = '#ffe9ad'; ctx.font = 'bold 21px Georgia, serif'; ctx.textAlign = 'left';
    ctx.fillText('Score  ' + score(), 32, 42);
    ctx.fillStyle = '#ffd3e8'; ctx.font = '14.5px Georgia, serif';
    ctx.fillText('Lotus ' + lotusCount + '   ·   ' + Math.floor(dist / 10) + ' m', 32, 65);
    if (combo > 1) { ctx.fillStyle = '#ffb84d'; ctx.font = 'bold 14.5px Georgia, serif'; ctx.fillText('Combo x' + combo, 168, 65); }
    if (divineT > 0) {
      ctx.fillStyle = 'rgba(255,215,94,0.3)'; rr(18, 86, 252, 9, 4); ctx.fill();
      ctx.fillStyle = '#ffd75e'; rr(18, 86, 252 * Math.max(0, divineT / 320), 9, 4); ctx.fill();
      ctx.fillStyle = '#ffd75e'; ctx.font = 'bold 13px Georgia, serif'; ctx.fillText('DIVINE BOW', 284, 95);
    }
  }
  function drawBtn(b) {
    if (b.round) {
      ctx.beginPath(); ctx.arc(b.x + b.w / 2, b.y + b.h / 2, b.w / 2, 0, 6.29);
      ctx.fillStyle = 'rgba(26,16,44,0.66)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,215,140,0.5)'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = '#ffe9ad'; ctx.font = 'bold 17px Georgia, serif'; ctx.textAlign = 'center';
      ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 6);
    } else {
      ctx.fillStyle = b.primary ? '#e8a33d' : 'rgba(26,16,44,0.75)';
      rr(b.x, b.y, b.w, b.h, 12); ctx.fill();
      if (!b.primary) { ctx.strokeStyle = 'rgba(255,215,140,0.6)'; ctx.lineWidth = 1.4; rr(b.x, b.y, b.w, b.h, 12); ctx.stroke(); }
      ctx.fillStyle = b.primary ? '#2a1602' : '#ffe9ad';
      ctx.font = 'bold 19px Georgia, serif'; ctx.textAlign = 'center';
      ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 7);
    }
  }
  function draw(t) {
    buttons = [];
    drawWorld(t);
    var running = state === 'play' || state === 'pause';
    drawRam(player.x, player.y, running && player.onGround, t);

    if (state === 'play' || state === 'pause') {
      drawPanel();
      buttons.push({ x: W - 106, y: 14, w: 40, h: 40, round: true, label: state === 'pause' ? '▶' : '❚❚', action: state === 'pause' ? 'resume' : 'pause' });
      buttons.push({ x: W - 56, y: 14, w: 40, h: 40, round: true, label: muted ? '✕♪' : '♪', action: 'sound' });
      if (bannerT > 0) {
        ctx.globalAlpha = Math.min(1, bannerT / 40);
        ctx.fillStyle = 'rgba(26,16,44,0.6)'; rr(W / 2 - 170, 104, 340, 36, 10); ctx.fill();
        ctx.fillStyle = '#ffe9ad'; ctx.font = 'bold 17px Georgia, serif'; ctx.textAlign = 'center';
        ctx.fillText(banner, W / 2, 128);
        ctx.globalAlpha = 1;
      }
    }
    if (state === 'pause') {
      ctx.fillStyle = 'rgba(16,8,30,0.55)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffe9ad'; ctx.font = 'bold 44px Georgia, serif'; ctx.textAlign = 'center';
      ctx.fillText('Paused', W / 2, 236);
      ctx.fillStyle = '#f3e2c2'; ctx.font = '17px Georgia, serif';
      ctx.fillText('Tap, press Space or P to continue', W / 2, 272);
      buttons.push({ x: W / 2 - 100, y: 300, w: 200, h: 50, label: 'Resume', action: 'resume', primary: true });
    }
    if (state === 'menu') {
      ctx.fillStyle = 'rgba(24,12,40,0.45)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd98a'; ctx.font = 'bold 54px Georgia, serif';
      ctx.fillText('Ramayana: Setu Runner', W / 2, 128);
      ctx.fillStyle = '#ffe9ad'; ctx.font = 'italic 19px Georgia, serif';
      ctx.fillText("The stones float because they carry Ram's name.", W / 2, 164);
      drawLotus(W / 2 - 120, 210, 1.15, true); drawLotus(W / 2 + 120, 210, 1.15, true);
      ctx.fillStyle = '#fff3da'; ctx.font = '18px Georgia, serif';
      ctx.fillText('Tap or press Space to begin', W / 2, 218);
      ctx.font = '15.5px Georgia, serif'; ctx.fillStyle = '#e9d9bd';
      ctx.fillText('Jump the rocks · dodge the demon birds · double jump over the gaps', W / 2, 258);
      ctx.fillText('Collect lotuses for combos · grab the golden arrow for Divine Bow power', W / 2, 282);
      ctx.fillText('PC: Space / ↑ jump · P pause · M sound      Mobile: tap to jump', W / 2, 314);
      if (best > 0) { ctx.fillStyle = '#ffd98a'; ctx.font = 'bold 17px Georgia, serif'; ctx.fillText('Best score: ' + best, W / 2, 348); }
      buttons.push({ x: W / 2 - 105, y: 372, w: 210, h: 54, label: 'Start the Run', action: 'start', primary: true });
    }
    if (state === 'over') {
      var a = Math.min(1, overT / 26);           // gentle fade-in, no shake
      ctx.fillStyle = 'rgba(14,7,26,' + (0.52 * a) + ')'; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.globalAlpha = a;
      ctx.translate(0, (1 - a) * 14);
      ctx.fillStyle = 'rgba(30,19,52,0.94)'; rr(W / 2 - 218, 108, 436, 308, 18); ctx.fill();
      ctx.strokeStyle = 'rgba(255,215,140,0.65)'; ctx.lineWidth = 1.6; rr(W / 2 - 218, 108, 436, 308, 18); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd98a'; ctx.font = 'bold 37px Georgia, serif';
      ctx.fillText('The Sea Claims the Run', W / 2, 162);
      if (newBest) {
        ctx.fillStyle = '#ffd75e'; rr(W / 2 - 74, 178, 148, 28, 14); ctx.fill();
        ctx.fillStyle = '#2a1602'; ctx.font = 'bold 15px Georgia, serif';
        ctx.fillText('★ NEW BEST ★', W / 2, 197);
      }
      ctx.fillStyle = '#fff3da'; ctx.font = '19px Georgia, serif';
      ctx.fillText('Score            ' + score(), W / 2, 240);
      ctx.fillText('Lotus collected   ' + lotusCount, W / 2, 272);
      ctx.fillText('Distance         ' + Math.floor(dist / 10) + ' m', W / 2, 304);
      ctx.fillStyle = '#cdbb96'; ctx.font = '16px Georgia, serif';
      ctx.fillText('Best score: ' + best, W / 2, 334);
      ctx.restore();
      if (overT > 22) {
        buttons.push({ x: W / 2 - 168, y: 356, w: 158, h: 50, label: 'Run Again', action: 'restart', primary: true });
        buttons.push({ x: W / 2 + 10, y: 356, w: 158, h: 50, label: 'Menu', action: 'menu' });
      }
    }
    for (var i = 0; i < buttons.length; i++) drawBtn(buttons[i]);
  }

  // ---------- main loop (frame-rate independent) ----------
  var last = 0, frame = 0;
  function loop(ts) {
    if (!last) last = ts;
    var dt = Math.min(34, ts - last) / 16.667; last = ts;
    if (dt <= 0) dt = 0.01; if (dt > 2) dt = 2;
    frame += dt;
    if (state !== 'pause') update(dt);
    else { for (var i = 0; i < clouds.length; i++) { clouds[i].x -= clouds[i].v * dt * 0.2; } }
    draw(frame);
    requestAnimationFrame(loop);
  }
  reset();
  requestAnimationFrame(loop);
})();
</script>
